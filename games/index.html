<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games | Eaten Frog</title>
  <meta name="description" content="Games by Eaten Frog, with each game's page, privacy policy and stores.">
  <link rel="icon" href="../assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css?v=6">
</head>
<body>
  <header class="site-head">
    <a class="brand" href="../"><img src="../assets/logo.svg" alt="Eaten Frog home" width="884" height="312"></a>
    <a class="games-link" href="./" aria-current="page">Games</a>
  </header>
  <main class="games">
    <h1>Games</h1>

    <!-- One <article class="game"> per game. Copy this block for a new game. -->
    <article class="game">
      <div>
        <h2>Fruit Rain</h2>
        <p class="what">Fruit-merge puzzle</p>
      </div>
      <div class="game-links">
        <a class="main" href="../fruit-rain/">About game</a>
        <a href="../fruit-rain/privacy/">Privacy policy</a>
      </div>
      <div class="platforms">
        <span class="label">Available on</span>
        <ul>
          <!-- When the store address is known, use: <li><a class="platform" href="STORE_URL">Google Play</a></li> -->
          <li><span class="platform">Google Play</span></li>
        </ul>
      </div>
    </article>
  </main>
  <footer>
    <a href="mailto:eatenfrog.gamedev@gmail.com">eatenfrog.gamedev@gmail.com</a>
    <span>© 2026 Eaten Frog</span>
  </footer>
</body>
</html>
